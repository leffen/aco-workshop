id: secret-deleted
title: A mounted Secret has been deleted
mode: incident
difficulty: intermediate
chaos: true        # a candidate for `make chaos` and the Lab 3 demo

# The interesting property: agent-harden cannot READ secrets. The agent has to
# diagnose from events alone, which is exactly the situation a least-privilege
# agent is in when it matters.
description: >
  A Secret that shopfront mounts is deleted. Pods fail to start. The agent must
  identify the missing Secret from events, without ever being able to read one.

setup:
  - kubectl -n $NS create secret generic shopfront-config --from-literal=api_token=s3cr3t
  - |
    kubectl -n $NS patch deploy shopfront --type=json -p '[
      {"op":"add","path":"/spec/template/spec/volumes","value":[
        {"name":"cfg","secret":{"secretName":"shopfront-config"}}]},
      {"op":"add","path":"/spec/template/spec/containers/0/volumeMounts","value":[
        {"name":"cfg","mountPath":"/etc/shopfront","readOnly":true}]}]'
  - kubectl -n $NS rollout status deploy/shopfront --timeout=90s

break:
  - kubectl -n $NS delete secret shopfront-config
  # Deleting the Secret alone breaks nothing: running pods keep what they have
  # already mounted, and health stayed green with no fix at all (2026-09-29).
  # Replacing the pods makes them mount a Secret that is gone, which is the
  # actual incident. Results before this change measured only the report.
  - kubectl -n $NS delete pod -l app=shopfront --wait=false
  - sleep 10

prompt: |
  Pods in namespace $NS have stopped starting correctly. Diagnose the root
  cause, explain what happened, and restore service.

max_iterations: 20
timeout_seconds: 420

expect:
  healthy: true
  assertions:
    - name: names-the-secret
      # Symptom is "pods pending". Cause is "a Secret is gone". The report has
      # to name the cause.
      report_contains_any: ["shopfront-config", "secret"]

fix:
  - kubectl -n $NS create secret generic shopfront-config --from-literal=api_token=s3cr3t
  - kubectl -n $NS rollout status deploy/shopfront --timeout=120s
